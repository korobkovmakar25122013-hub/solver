name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip PhotoSolver.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
        working-directory: PhotoSolver
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSolver-apk
          path: PhotoSolver/app/build/outputs/apk/debug/app-debug.apk
